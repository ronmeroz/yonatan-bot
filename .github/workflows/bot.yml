name: Yonatan alerts

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"   # every 10 minutes (off the busy :00 mark)
  workflow_dispatch:
    inputs:
      check:
        description: "Only test the connection (league site + Telegram)"
        type: boolean
        default: false

concurrency:
  group: yonatan-bot          # never two runs at once; a run watching a game holds the slot
  cancel-in-progress: false

permissions:
  contents: write             # to save the encrypted state file

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Jerusalem
      PYTHONIOENCODING: utf-8
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      SEED_CHAT_IDS: ${{ vars.SEED_CHAT_IDS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Connection test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check }}
        run: python cloud.py --check

      - name: Run bot
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.check) }}
        run: python cloud.py

      - name: Save state
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.check) }}
        run: |
          if [ -n "$(git status --porcelain state.enc)" ]; then
            git config user.name "yonatan-bot"
            git config user.email "yonatan-bot@users.noreply.github.com"
            git add state.enc
            git commit -m "state update" -q
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
