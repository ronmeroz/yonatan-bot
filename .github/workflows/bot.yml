name: Yonatan alerts

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # every 10 minutes (off the busy :00 mark)
  workflow_dispatch:
    inputs:
      check:
        description: "Only test the connection (league site + Telegram)"
        type: boolean
        default: false

concurrency:
  group: yonatan-bot          # never two runs at once; a run watching a game holds the slot
  cancel-in-progress: false

permissions:
  contents: write             # to save the encrypted state file
  actions: write              # game days: a run can hand over to a fresh run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Jerusalem
      PYTHONIOENCODING: utf-8
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      SEED_CHAT_IDS: ${{ vars.SEED_CHAT_IDS }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Connection test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check }}
        run: python cloud.py --check

      - name: Run bot
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.check) }}
        run: python cloud.py

      - name: Save state
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.check) }}
        run: |
          if [ -n "$(git status --porcelain state.enc)" ]; then
            git config user.name "yonatan-bot"
            git config user.email "yonatan-bot@users.noreply.github.com"
            cp state.enc /tmp/state.enc
            for i in 1 2 3 4 5; do
              # this run's state is the newest - always put it on top of whatever is on GitHub
              git fetch -q origin main && git reset -q --hard origin/main && cp /tmp/state.enc state.enc
              git add state.enc
              git diff --cached --quiet && break
              git commit -qm "state update" && git push -q origin HEAD:main && break
              sleep 5
            done
          fi

      - name: Hand over to a fresh run
        if: ${{ always() && hashFiles('.handover') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main -R "$GITHUB_REPOSITORY"
